<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Look at the sky</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
<body>

    <!-- Cabeçalho com logo e barra de pesquisa -->
    <header>
        <div class="header-content">
            <div>
                <h1>Look at the sky.</h1>
                <div class="apresentation">
                    <p>
                        This website consumes NASA's APOD API. <br>
                        A website created by <b>Gabriel Müehlbauer</b>  
                    </p>
                </div>
            </div>
            <div>
                <input type="text" id="search-bar" placeholder="Explore o universo...">
            </div>
        </div>
    </header>

    <main>
        <div class="pictures-list" id="gallery">
        </div>

        <div class="load-more-container">
            <button id="btn-load-more">Descobrir mais galáxias</button>
        </div>
    </main>

    <!-- Bloco dinâmico com detalhes da imagem -->
    <section id="details">
        <div id="details-content">
            <h2></h2>
            <h3></h3>
            <p></p>
            <img src="" alt="">
            <p></p>
        </div>
    </section>

    <script src="assets/js/app.js"></script>
</body>

</html>
